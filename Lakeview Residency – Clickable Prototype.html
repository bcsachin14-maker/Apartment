<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Lakeview Residency – Clickable Prototype</title>
<style>
:root{--bg:#F4F6FB;--cd:#fff;--tx:#12203F;--mu:#5A6580;--pr:#12306B;--pt:#fff;--bd:#E3E8F2;--ok:#17794D;--okb:#DDF3E8;--wn:#8A5300;--wnb:#FFF3D6;--er:#9B1C1C;--erb:#FDECEC;--sf:#EEF2FA;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0E1424;--cd:#182036;--tx:#EAF0FF;--mu:#A3AFC9;--pr:#8FB0FF;--pt:#0E1424;--bd:#2A3552;--ok:#5FD39B;--okb:#12382A;--wn:#F2C46D;--wnb:#3A2E10;--er:#FF9A9A;--erb:#3D1A1A;--sf:#202A45}}
:root[data-theme=dark]{--bg:#0E1424;--cd:#182036;--tx:#EAF0FF;--mu:#A3AFC9;--pr:#8FB0FF;--pt:#0E1424;--bd:#2A3552;--ok:#5FD39B;--okb:#12382A;--wn:#F2C46D;--wnb:#3A2E10;--er:#FF9A9A;--erb:#3D1A1A;--sf:#202A45}
body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:left}
h1,h2,h3,p{margin:0}h1{font-size:18px}h2{font-size:20px}small,.mu{color:var(--mu)}small{font-size:12px;display:block}
.top{display:flex;gap:6px;padding:10px;overflow-x:auto;justify-content:center}.top button{padding:9px 14px;border-radius:20px;background:var(--cd);border:1px solid var(--bd);font-weight:600;white-space:nowrap;min-height:40px}.top .on{background:var(--pr);color:var(--pt)}
.fr{position:relative;width:390px;max-width:100%;height:min(800px,calc(100dvh - 76px));min-height:560px;margin:0 auto 10px;border:1px solid var(--bd);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
.fr.web{width:min(1180px,100%);border-radius:12px;flex-direction:row}
.hd{display:flex;align-items:center;gap:6px;padding:14px 12px 6px;background:var(--cd)}.hd button{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.bd{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
nav{display:flex;justify-content:space-around;background:var(--cd);border-top:1px solid var(--bd);padding:6px 0 8px}nav button{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:60px;min-height:44px;font-size:11px;font-weight:600;color:var(--mu)}nav .on{color:var(--pr)}
.sd{width:190px;background:var(--cd);border-right:1px solid var(--bd);padding:12px;display:flex;flex-direction:column;gap:4px;overflow:auto}.sd button{padding:11px 12px;border-radius:10px;font-weight:600;color:var(--mu)}.sd .on{background:var(--sf);color:var(--pr)}
.mn{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.cd{background:var(--cd);border-radius:16px;padding:14px;box-shadow:0 1px 3px rgba(18,48,107,.1);display:flex;flex-direction:column;gap:8px;text-align:left}.wnb{outline:1.5px solid var(--wn)}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}.rt{flex:1;min-height:40px;display:flex;flex-direction:column;justify-content:center}
.b,.b2,.bs{border-radius:12px;min-height:44px;padding:0 16px;font-weight:600;display:flex;align-items:center;justify-content:center;text-align:center}.b{background:var(--pr);color:var(--pt)}.b2{border:1.5px solid var(--pr);color:var(--pr)}.bs{min-height:36px;padding:0 12px;font-size:12px;border:1.5px solid var(--pr);color:var(--pr)}.bs.er{border-color:var(--er);color:var(--er)}
.bg{font-size:11px;font-weight:700;border-radius:8px;padding:3px 8px;background:var(--sf);color:var(--pr);white-space:nowrap}.bg.ok{background:var(--okb);color:var(--ok)}.bg.wn{background:var(--wnb);color:var(--wn)}.bg.er{background:var(--erb);color:var(--er)}
.r2{display:flex;gap:10px}.r2>*{flex:1}.sp2{display:flex;justify-content:space-between;align-items:center}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 4px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tl{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;text-align:center;min-height:44px}.ti{width:50px;height:50px;border-radius:15px;background:var(--sf);color:var(--pr);display:flex;align-items:center;justify-content:center}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--mu)}input,select{height:44px;border:1.5px solid var(--bd);border-radius:12px;padding:0 12px;font:15px inherit;background:var(--cd);color:var(--tx)}
.sos{background:#C62828;color:#fff;border-radius:18px;padding:14px 18px;display:flex;align-items:center;gap:14px;min-height:60px}.sos b{display:block;font-size:16px}.sos small{color:#fff}
.gr{display:flex;align-items:center;gap:12px}.gr div:nth-child(2){flex:1}.av{width:44px;height:44px;border-radius:50%;background:var(--pr);color:var(--pt);font-weight:700;display:flex;align-items:center;justify-content:center}.ib{width:44px;height:44px;border-radius:50%;background:var(--cd);display:flex;align-items:center;justify-content:center}
.ctr{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}.ci{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center}.ci.ok{background:var(--okb);color:var(--ok)}.ci.er{background:var(--erb);color:var(--er)}.logo{width:80px;height:80px;border-radius:24px;background:var(--pr);color:var(--pt);font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center}
#ov{display:none}#ov:not(:empty){display:flex;position:absolute;inset:0;background:rgba(10,15,30,.55);align-items:center;justify-content:center;z-index:9;padding:20px}
.md{background:var(--cd);border-radius:20px;padding:20px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;text-align:center;align-items:stretch}.sh{align-self:flex-end;max-width:none;border-radius:20px 20px 0 0;margin:0 -20px -20px;width:calc(100% + 40px);text-align:left}#ov:has(.sh){align-items:flex-end}
.sp{width:34px;height:34px;border:4px solid var(--sf);border-top-color:var(--pr);border-radius:50%;animation:s 1s linear infinite;margin:auto}@keyframes s{to{transform:rotate(360deg)}}
.tt{position:absolute;left:16px;right:16px;bottom:84px;background:var(--tx);color:var(--bg);border-radius:12px;padding:12px 14px;z-index:10;font-weight:600}.fr.web .tt{left:auto;max-width:360px;bottom:20px;right:20px}
.bn{padding:8px 16px;font-weight:600;font-size:12px}.bn.wn{background:var(--wnb);color:var(--wn)}
.tg{width:48px;height:28px;border-radius:14px;background:var(--bd);position:relative;flex:none}.tg:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.tg[aria-pressed=true]{background:var(--ok)}.tg[aria-pressed=true]:after{left:23px}
.chip{border:1.5px solid var(--bd);border-radius:12px;min-height:44px;display:flex;align-items:center;justify-content:center;font-weight:600}.chip.on{background:var(--erb);border-color:var(--er);color:var(--er)}
.msg{background:var(--sf);border-radius:14px;padding:8px 12px;max-width:80%}.msg.me{background:var(--pr);color:var(--pt);align-self:flex-end}
.mt{display:flex;flex-direction:column;gap:2px}.mt h2{font-size:22px}
.scan{height:200px;border-radius:16px;background:#0b1220;display:flex;align-items:center;justify-content:center}.scan div{width:130px;height:130px;border:3px solid #5FD39B;border-radius:14px}
</style></head><body>
<div class="top" id="rb" role="tablist" aria-label="Switch user role"></div>
<div class="fr" id="app"></div>
<script>
const $=s=>document.querySelector(s),S={},FM={};
let role='r',stk=['splash'],tm,st={msg:'',th:'',f:'',g:['',''],p:['',''],off:0,sos:0,ch:['Welcome to the Lakeview community chat','Water tank cleaning on Sunday 10 AM'],vote:-1,star:0};
const HM={r:'home',g:'g_home',a:'a_over',i:'i_over',gu:'gu_home',v:'v_home'},ST={r:'splash',g:'g_login',a:'a_over',i:'i_over',gu:'gu_home',v:'v_home'};
const RN={r:'Homeowner',g:'Security guard',a:'Apartment admin',gu:'Guest',i:'Internet provider',v:'Vendor staff'};
const NV={r:[['home','Home','home'],['svc','Services','grid'],['comm','Community','chat'],['alerts','Alerts','bell'],['prof','Profile','user']],g:[['g_home','Visitors','clk'],['g_scan','Scan','qr'],['g_sos','SOS','warn'],['g_log','Log','doc']],
a:[['a_over','Overview'],['a_res','Residents'],['a_cmp','Complaints'],['a_bill','Billing'],['a_bk','Bookings & events'],['a_sos','SOS incidents'],['a_mod','Moderation'],['a_ann','Announcements'],['a_log','Audit & reports']],
i:[['i_over','Overview'],['i_sub','Subscribers'],['i_plan','Plans'],['i_tx','Transactions'],['i_tk','Outages & tickets']]};
const P={home:'M3 11l9-8 9 8v10H3z',grid:'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z',chat:'M4 5h16v11H9l-5 4z',bell:'M6 16v-5a6 6 0 0112 0v5l2 2H4zM10 21h4',user:'M12 12a4 4 0 100-8 4 4 0 000 8zM4 21c0-4 4-6 8-6s8 2 8 6',card:'M3 6h18v12H3zM3 10h18',wifi:'M2 9a15 15 0 0120 0M5 13a10 10 0 0114 0M8.5 16.5a5 5 0 017 0M12 20h.01',tool:'M14 6a4 4 0 005 5l-9 9a2.1 2.1 0 01-3-3l9-9z',cal:'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',clk:'M12 21a9 9 0 100-18 9 9 0 000 18zM12 7v5l3 2',car:'M5 16v-5l2-5h10l2 5v5zM5 16v2M19 16v2M5 13h14',mega:'M3 11v3h4l8 4V7l-8 4zM19 9v6',plus:'M10 12a4 4 0 100-8 4 4 0 000 8zM2 21c0-4 3.5-6 8-6M18 8v6M15 11h6',doc:'M6 3h9l4 4v14H6zM9 12h7M9 16h7',qr:'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 18h2v2h-2z',warn:'M12 3l10 18H2zM12 10v5M12 18h.01',chk:'M5 12l5 5 9-10',x:'M6 6l12 12M18 6L6 18',back:'M15 6l-6 6 6 6',star:'M12 3l2.5 6 6.5.5-5 4.3 1.6 6.4-5.6-3.5-5.6 3.5L8 13.8 3 9.5l6.5-.5z',key:'M3 11l9-8 9 8v10H3zM9 21v-6h6v6'};
const ic=(n,c='currentColor',s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${P[n]}"/></svg>`;
const B=(l,a,c='b')=>`<button class="${c}" data-a="${a}">${l}</button>`,G=(t,c='')=>`<span class="bg ${c}">${t}</span>`;
const R=(t,s,a,bd,x)=>`<div class="row"><button class="rt" ${a?`data-a="${a}"`:'disabled'}><b>${t}</b><small>${s||''}</small></button>${bd?G(...bd):''}${(x||[]).map(([l,a,c])=>B(l,a,'bs '+(c||''))).join('')}</div>`;
const L=a=>`<div class="cd">${a.map(x=>R(...x)).join('')}</div>`,T=(l,n,a)=>`<button class="tl" data-a="${a}"><span class="ti">${ic(n,'currentColor',22)}</span>${l}</button>`;
const M=a=>`<div class="g3">${a.map(([l,v,c])=>`<div class="cd mt"><small>${l}</small><h2>${v}</h2>${c?G(c[0],c[1]):''}</div>`).join('')}</div>`;
const TG=(l,on)=>`<div class="row"><span class="rt">${l}</span><button class="tg" data-a="tgl" aria-pressed="${!!on}" aria-label="${l}"></button></div>`;
const Q=`<svg width="130" height="130" viewBox="0 0 21 21" role="img" aria-label="QR code" style="background:#fff;padding:8px;border-radius:12px"><g fill="#12203F"><rect width="7" height="7"/><rect x="14" width="7" height="7"/><rect y="14" width="7" height="7"/><path d="M9 0h2v2H9zM12 3h2v2h-2zM9 6h3v2H9zM0 9h2v2H0zM4 9h3v2H4zM9 9h2v3H9zM13 9h3v2h-3zM18 9h3v3h-3zM9 14h2v3H9zM13 14h3v2h-3zM17 16h4v2h-4zM12 19h3v2h-3z"/></g><g fill="#fff"><rect x="1" y="1" width="5" height="5"/><rect x="15" y="1" width="5" height="5"/><rect x="1" y="15" width="5" height="5"/></g><g fill="#12203F"><rect x="2" y="2" width="3" height="3"/><rect x="16" y="2" width="3" height="3"/><rect x="2" y="16" width="3" height="3"/></g></svg>`;
const FL=fs=>fs.map(([l,v,o])=>o=='f'?B(l,'toast:Camera permission requested','b2'):o?`<label>${l}<select>${o.map(x=>`<option>${x}</option>`).join('')}</select></label>`:`<label>${l}<input value="${v}"></label>`).join('');
const ov=h=>$('#ov').innerHTML=h,load=fn=>{ov('<div class="md" role="status"><div class="sp"></div><p>Please wait…</p></div>');setTimeout(()=>{ov('');fn()},800)};
const toast=m=>{const t=document.createElement('div');t.className='tt';t.setAttribute('role','status');t.textContent=m;$('#app').append(t);setTimeout(()=>t.remove(),2200)};
const go=id=>{if(Object.values(HM).includes(id))stk=[id];else stk.push(id);draw()};
function act(a){const i=a.indexOf(':'),k=i<0?a:a.slice(0,i),v=i<0?'':a.slice(i+1);({
go:()=>go(v),tab:()=>{stk=[v];draw()},back:()=>{stk.length>1&&stk.pop();draw()},home:()=>{stk=[HM[role]];draw()},ld:()=>load(()=>go(v)),
sub:()=>{st.msg=v;load(()=>go('ok'))},toast:()=>toast(v),x:()=>ov(''),do:()=>{ov('');act(v)},
cf:()=>{const[t,b,n]=v.split('|');ov(`<div class="md" role="dialog" aria-modal="true"><h3>${t}</h3><p class="mu">${b}</p><div class="r2">${B('Cancel','x','b2')}${B('Confirm','do:'+n)}</div></div>`)},
f:()=>{st.f=v;go('f')},g:()=>{st.g=v.split('|');go('gen')},th:()=>{st.th=v;go('thread')},
role:()=>{role=v;stk=[ST[v]];draw()},fs:()=>{const f=FM[st.f];f[4]?act(f[4]):act('sub:'+f[3])},
pay:()=>{st.p=v.split('|');ov(`<div class="md sh" role="dialog" aria-modal="true"><h3>Pay ${st.p[0]}</h3><small>${st.p[1]} · includes 18% GST where applicable</small>${['UPI|upi','Credit / debit card|card','Net banking|nb','Wallet|w'].map(x=>B(x.split('|')[0],'pm:'+x.split('|')[1],'b2')).join('')}<small>Demo: card payment fails to show the retry flow. Duplicate payments are blocked.</small>${B('Cancel','x','bs')}</div>`)},
pm:()=>{ov('');load(()=>{if(v=='card')go('fail');else{st.msg=`Paid ${st.p[0]} for ${st.p[1]}. Txn ID TXN84${Date.now()%99999}. Receipt saved.`;go('ok')}})},
tog:()=>{const d=document.documentElement;d.dataset.theme=d.dataset.theme=='dark'?'light':'dark';draw()},off:()=>{st.off^=1;draw()},
snd:()=>{const i=$('#mi');if(i&&i.value){st.ch.push(i.value);draw()}},rate:()=>{st.star=+v;draw()},vote:()=>{st.vote=+v;draw()},
sos:()=>{st.sos=0;go('sosx');[1500,3500,6000].forEach((d,n)=>setTimeout(()=>{st.sos=n+1;stk[stk.length-1]=='sosx'&&draw()},d))}}[k]||(()=>{}))()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;if(a=='tgl'){b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!='true');return}if(a=='sel'){b.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));b.classList.add('on');return}act(a)});
function draw(){clearTimeout(tm);const id=stk.at(-1),[t,h]=S[id](),web=role=='a'||role=='i',nv=NV[role]||[],ti=nv.findIndex(n=>n[0]==id);let x;
if(web)x=`<aside class="sd"><b style="padding:8px 12px">${role=='a'?'Admin portal':'ISP portal'}</b>${nv.map(n=>`<button class="${n[0]==id?'on':''}" data-a="tab:${n[0]}">${n[1]}</button>`).join('')}${B('Log out','cf:Log out?|You will return to the landing screen.|role:'+role,'bs')}</aside><div class="mn"><h2>${t}</h2>${h}</div>`;
else x=`${t?`<header class="hd">${ti<0&&stk.length>1?`<button aria-label="Back" data-a="back">${ic('back','currentColor',24)}</button>`:''}<h1>${t}</h1></header>`:''}${st.off?'<div class="bn wn" role="status">Offline - changes will sync when connected</div>':''}<div class="bd">${h}</div>${ti>=0?`<nav aria-label="Main">${nv.map(n=>`<button class="${n[0]==id?'on':''}" data-a="tab:${n[0]}">${ic(n[2],'currentColor',22)}${n[1]}</button>`).join('')}</nav>`:''}`;
$('#app').className='fr'+(web?' web':'');$('#app').innerHTML=x+'<div id="ov"></div>';
$('#rb').innerHTML=Object.keys(RN).map(k=>`<button role="tab" aria-selected="${k==role}" class="${k==role?'on':''}" data-a="role:${k}">${RN[k]}</button>`).join('');
if(id=='splash')tm=setTimeout(()=>{stk=['login'];draw()},1600)}
// ---- shared ----
S.splash=()=>['',`<div class="ctr"><div class="logo">LR</div><h2>Lakeview Residency</h2><p class="mu">One app for your community</p><div class="sp"></div></div>`];
S.ok=()=>['',`<div class="ctr"><div class="ci ok">${ic('chk','currentColor',34)}</div><h2>Success</h2><p class="mu">${st.msg}</p>${B('Back to home','home')}</div>`];
S.fail=()=>['',`<div class="ctr"><div class="ci er">${ic('x','currentColor',34)}</div><h2>Payment failed</h2><p class="mu">Your card was declined. You have not been charged.</p>${B('Retry with UPI','pm:upi')}${B('Choose another method','pay:'+st.p.join('|'),'b2')}</div>`];
S.empty=()=>['No tickets',`<div class="ctr"><div class="ci" style="background:var(--sf)">${ic('doc','var(--pr)',34)}</div><h2>Nothing here yet</h2><p class="mu">When you raise a complaint it will show up here.</p>${B('Raise a complaint','f:cmpN')}</div>`];
S.gen=()=>[st.g[0],`<div class="cd"><p>${st.g[1]}</p></div>${B('Back','back','b2')}`];
S.f=()=>{const f=FM[st.f];return[f[0],`<div class="cd">${FL(f[1])}</div>${B(f[2],'fs')}`]};
// ---- resident onboarding ----
S.login=()=>['Welcome',`<label>Mobile number<input value="+91 98765 43210" inputmode="tel"></label>${B('Send OTP','ld:otp')}${B('Continue with email','toast:Email login is optional','b2')}${B('Continue with Google','toast:Social login demo','b2')}<small>By continuing you accept the ${'<button style="display:inline;text-decoration:underline" data-a="g:Terms|Sample terms of service text.">Terms</button> and <button style="display:inline;text-decoration:underline" data-a="g:Privacy policy|We only share resident data with authorised staff. You can request deletion anytime.">Privacy policy</button>'}.</small>`];
S.otp=()=>['Verify OTP',`<p class="mu">Enter the 4-digit code sent to +91 98765 43210</p><div class="r2">${[1,2,3,4].map(n=>`<input aria-label="Digit ${n}" maxlength="1" value="${n}" style="text-align:center">`).join('')}</div>${B('Verify','ld:reg')}${B('Resend OTP','toast:OTP resent','b2')}`];
S.reg=()=>['Set up profile',`<div class="cd">${FL([['Full name','Anita R.'],['Apartment',0,['Lakeview Residency']],['Tower / block',0,['Tower B','Tower A','Tower C']],['Floor',0,['4','3','5']],['Flat',0,['402','401']],['I am a',0,['Homeowner','Tenant']]])}${TG('I accept privacy and data-sharing consent',1)}</div>${B('Submit for verification','ld:pending')}`];
S.pending=()=>['Awaiting approval',`<div class="cd">${R('Profile submitted','Done',0,['Done','ok'])}${R('Admin verification','Usually within 24 hours',0,['Pending','wn'])}</div>${B('Simulate admin approval','ld:home')}`];
// ---- resident ----
S.home=()=>['',`<div class="gr"><div class="av">AR</div><div><h1>Good evening, Anita</h1><small>Lakeview Residency · Tower B · Flat 402</small></div><button class="ib" aria-label="Alerts" data-a="tab:alerts">${ic('bell')}</button></div>
<button class="sos" data-a="go:sos">${ic('warn','#fff',26)}<span><b>SOS Emergency</b><small>Alert security and management</small></span></button>
